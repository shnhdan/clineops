name: ClineOps Pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - run: pip install -r requirements.txt

      - name: Run pipeline
        run: python etl/pipeline.py
        continue-on-error: true

      - name: Run tests
        id: tests
        run: pytest
        continue-on-error: true

      - name: Install Cline
        if: steps.tests.outcome == 'failure'
        run: npm install -g @cline/cli

      - name: Run Cline Repair
        if: steps.tests.outcome == 'failure'
        run: |
          ERROR=$(pytest || true)
          CODE=$(cat etl/transform.py)
          DATA=$(python - <<EOF
          from etl.fetch import fetch_data
          print(fetch_data())
          EOF
           )

                cline run cline/repair.yaml \
                --error_log "$ERROR" \
               --code "$CODE" \
               --data "$DATA" \
            > etl/transform.py

      -      name: Re-run tests
             if: steps.tests.outcome == 'failure'
             run: pytest
  name: Commit updates
    run: |
         git config user.name github-actions
          git config user.email actions@github.com
          git add .
          git commit -m "Auto update metrics / repair" || echo "No changes"
          git push
