<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ClineOps Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
background:#0f172a;
color:#e2e8f0;
font-family:Inter,system-ui;
text-align:center;
padding:40px;
}

.card{
background:#020617;
padding:30px;
border-radius:16px;
box-shadow:0 0 40px rgba(0,0,0,.5);
margin:auto;
max-width:700px;
margin-bottom:30px;
}

.status{
font-size:2rem;
font-weight:bold;
margin-bottom:15px;
}

.label{opacity:.6;margin-top:15px}
.value{font-weight:bold;margin-top:5px}

.diff{
background:#020617;
padding:15px;
margin-top:15px;
border-radius:10px;
text-align:left;
font-family:monospace;
}

.old{color:#ef4444}
.new{color:#22c55e}

canvas{
margin-top:30px;
}
</style>
</head>

<body>

<h1>ClineOps Autonomous Data Guard</h1>

<div class="card">

<div id="status" class="status">Loading...</div>

<div class="label">Runtime</div>
<div id="runtime" class="value">-</div>

<div class="label">Last Execution</div>
<div id="time" class="value">-</div>

<div class="label">Error</div>
<div id="error" class="value">None</div>

<div class="label">AI Suggestion</div>
<div id="suggestion" class="value">-</div>

<div class="label">Preview Output</div>
<div id="preview" class="value">-</div>

<div class="diff">
<div class="old" id="old"></div>
<div class="new" id="new"></div>
</div>

</div>

<canvas id="chart" width="600" height="300"></canvas>

<script>

fetch("metrics.json?nocache="+Date.now())
.then(r=>r.json())
.then(data=>{

let runs=data.runs
let latest=runs[runs.length-1]

let s=document.getElementById("status")
s.innerText=latest.status.toUpperCase()
s.style.color=latest.status==="success"?"#22c55e":"#ef4444"

document.getElementById("runtime").innerText=latest.runtime_sec+" sec"
document.getElementById("time").innerText=new Date(latest.timestamp*1000).toLocaleString()
document.getElementById("error").innerText=latest.error||"None"
document.getElementById("suggestion").innerText=latest.suggestion||"-"
document.getElementById("preview").innerText=latest.preview??"-"

document.getElementById("old").innerText=latest.old_code? "− "+latest.old_code:""
document.getElementById("new").innerText=latest.new_code? "+ "+latest.new_code:""


// chart
let labels=runs.map((_,i)=>i+1)
let values=runs.map(r=>r.status==="success"?1:0)

new Chart(document.getElementById("chart"),{
type:"line",
data:{
labels:labels,
datasets:[{
label:"Pipeline Reliability",
data:values,
fill:true
}]
},
options:{
scales:{
y:{
ticks:{
callback:v=>v===1?"OK":"FAIL"
}
}
}
}
})

})

</script>

</body>
</html>
