<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ClineOps Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:linear-gradient(135deg,#0f172a,#020617);
color:#e2e8f0;
font-family:Inter,system-ui;
margin:0;
padding:40px;
}

.wrapper{
display:flex;
gap:30px;
max-width:1300px;
margin:auto;
align-items:flex-start;
}

.main{
flex:2;
}

.side{
flex:1;
}

.card{
background:#020617;
padding:28px;
border-radius:18px;
box-shadow:0 0 40px rgba(0,0,0,.6);
margin-bottom:25px;
}

.status{
font-size:2rem;
font-weight:bold;
text-align:center;
margin-bottom:18px;
}

.label{opacity:.6;margin-top:14px}
.value{font-weight:bold;margin-top:4px}

.log{
height:500px;
overflow:auto;
font-family:monospace;
}

.run{
padding:10px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.ok{color:#22c55e}
.fail{color:#ef4444}

canvas{
margin-top:25px;
}

</style>
</head>

<body>

<h1 style="text-align:center;margin-bottom:30px">
ClineOps Autonomous Reliability Engine
</h1>

<div class="wrapper">

<!-- LEFT MAIN PANEL -->
<div class="main">

<div class="card">

<div id="status" class="status">Loading...</div>

<div class="label">Runtime</div>
<div id="runtime" class="value">-</div>

<div class="label">Last Execution</div>
<div id="time" class="value">-</div>

<div class="label">Error</div>
<div id="error" class="value">-</div>

<div class="label">AI Suggestion</div>
<div id="suggestion" class="value">-</div>

<div class="label">Preview Output</div>
<div id="preview" class="value">-</div>

</div>

<div class="card">
<canvas id="chart"></canvas>
</div>

</div>


<!-- RIGHT SIDE HISTORY -->
<div class="side">

<div class="card">
<h3>Run History</h3>
<div id="history" class="log"></div>
</div>

</div>

</div>


<script>

fetch("metrics.json?"+Date.now())
.then(r=>r.json())
.then(data=>{

if(!data.runs || data.runs.length===0){
document.getElementById("status").innerText="NO RUNS"
return
}

let runs=data.runs
let latest=runs[runs.length-1]
let success=latest.status==="success"

/* STATUS */

let status=document.getElementById("status")
status.innerText=(latest.status||"unknown").toUpperCase()
status.style.color= success ? "#22c55e" : "#ef4444"


/* VALUES */

document.getElementById("runtime").innerText=
latest.runtime ?? latest.runtime_sec ?? "-"

document.getElementById("time").innerText=
latest.time
? new Date(latest.time*1000).toLocaleString()
: latest.timestamp
? new Date(latest.timestamp*1000).toLocaleString()
: "-"

document.getElementById("error").innerText=
latest.error || "None"

document.getElementById("suggestion").innerText=
success ? "No suggestions" : latest.suggestion || "No suggestion"

document.getElementById("preview").innerText=
latest.preview ?? "-"


/* HISTORY PANEL */

let box=document.getElementById("history")

runs.slice().reverse().forEach((r,i)=>{
let div=document.createElement("div")
div.className="run "+(r.status==="success"?"ok":"fail")

let t=r.time || r.timestamp

div.innerText=
"Run "+(runs.length-i)+
"  |  "+(r.status==="success"?"SUCCESS":"FAIL")+
"  |  "+new Date(t*1000).toLocaleTimeString()

box.appendChild(div)
})


/* GRAPH */

const ctx=document.getElementById("chart").getContext("2d")

let values=runs.map(r=>r.status==="success"?1:0)

let gradient=ctx.createLinearGradient(0,0,0,300)

if(success){
gradient.addColorStop(0,"#22c55e")
gradient.addColorStop(1,"rgba(34,197,94,0)")
}else{
gradient.addColorStop(0,"#ef4444")
gradient.addColorStop(1,"rgba(239,68,68,0)")
}

new Chart(ctx,{
type:"line",
data:{
labels:runs.map((_,i)=>"Run "+(i+1)),
datasets:[{
label:"Pipeline Reliability",
data:values,
borderColor:gradient,
backgroundColor:gradient,
fill:true,
tension:.35,
borderWidth:4,
pointRadius:7,
pointBackgroundColor:values.map((v,i)=>
i===values.length-1
? "#facc15"
: (v? "#22c55e":"#ef4444")
)
}]
},
options:{
plugins:{
legend:{labels:{color:"#e2e8f0"}}
},
scales:{
x:{ticks:{color:"#94a3b8"},grid:{color:"rgba(148,163,184,.15)"}},
y:{
min:0,max:1,
ticks:{color:"#94a3b8",callback:v=>v?"SUCCESS":"FAIL"},
grid:{color:"rgba(148,163,184,.15)"}
}
}
}
})

})

</script>

</body>
</html>
