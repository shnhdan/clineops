<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ClineOps Platform Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
background:linear-gradient(135deg,#0f172a,#020617);
color:#e2e8f0;
font-family:Inter,system-ui;
text-align:center;
padding:40px;
}

.card{
background:#020617;
padding:32px;
border-radius:18px;
box-shadow:0 0 50px rgba(0,0,0,.6);
margin:auto;
max-width:720px;
margin-bottom:35px;
border:1px solid rgba(255,255,255,.08);
}

.status{
font-size:2.2rem;
font-weight:bold;
margin-bottom:18px;
}

.label{opacity:.6;margin-top:16px}
.value{font-weight:bold;margin-top:5px}

.diff{
background:#020617;
padding:18px;
margin-top:20px;
border-radius:12px;
text-align:left;
font-family:monospace;
border:1px solid rgba(255,255,255,.05);
}

.old{color:#ef4444}
.new{color:#22c55e}

canvas{margin-top:35px;max-width:900px}
</style>
</head>

<body>

<h1>ClineOps Autonomous Reliability Engine</h1>

<div class="card">

<div id="status" class="status">Loading...</div>

<div class="label">Runtime</div>
<div id="runtime" class="value">-</div>

<div class="label">Last Execution</div>
<div id="time" class="value">-</div>

<div class="label">Error</div>
<div id="error" class="value">-</div>

<div class="label">AI Suggestion</div>
<div id="suggestion" class="value">-</div>

<div class="label">Preview Output</div>
<div id="preview" class="value">-</div>

<div class="diff">
<div class="old" id="old"></div>
<div class="new" id="new"></div>
</div>

</div>

<canvas id="chart"></canvas>

<script>

fetch("metrics.json?nocache="+Date.now())
.then(r=>r.json())
.then(data=>{

if(!data.runs || data.runs.length===0){
document.getElementById("status").innerText="NO RUNS YET"
return
}

let runs=data.runs
let latest=runs[runs.length-1]

/* ---------- STATUS ---------- */

let statusEl=document.getElementById("status")
statusEl.innerText=(latest.status||"unknown").toUpperCase()

let success=latest.status==="success"

statusEl.style.color=success ? "#22c55e" : "#ef4444"

/* ---------- SAFE VALUES ---------- */

document.getElementById("runtime").innerText =
latest.runtime ?? latest.runtime_sec ?? "-"

document.getElementById("time").innerText =
latest.time
? new Date(latest.time*1000).toLocaleString()
: latest.timestamp
? new Date(latest.timestamp*1000).toLocaleString()
: "-"

document.getElementById("error").innerText =
latest.error || "None"

document.getElementById("suggestion").innerText =
success
? "No suggestions"
: latest.suggestion || "No suggestion generated"

document.getElementById("preview").innerText =
latest.preview ?? "-"

document.getElementById("old").innerText =
latest.old_code ? "− "+latest.old_code : ""

document.getElementById("new").innerText =
latest.new_code ? "+ "+latest.new_code : ""


/* ---------- GRAPH ---------- */

const ctx=document.getElementById("chart").getContext("2d")

const values=runs.map(r=>r.status==="success"?1:0)

const hasFailure=values.includes(0)

const gradient=ctx.createLinearGradient(0,0,0,300)

if(hasFailure){
gradient.addColorStop(0,"#ef4444")
gradient.addColorStop(1,"rgba(239,68,68,0)")
}else{
gradient.addColorStop(0,"#22c55e")
gradient.addColorStop(1,"rgba(34,197,94,0)")
}

new Chart(ctx,{
type:"line",
data:{
labels:runs.map((_,i)=>"Run "+(i+1)),
datasets:[{
label:"Pipeline Health",
data:values,
borderColor:gradient,
backgroundColor:gradient,
fill:true,
tension:.35,
borderWidth:4,
pointRadius:6,
pointHoverRadius:9
}]
},
options:{
responsive:true,
plugins:{
legend:{
labels:{color:"#e2e8f0"}
}
},
scales:{
x:{
ticks:{color:"#94a3b8"},
grid:{color:"rgba(148,163,184,.15)"}
},
y:{
min:0,
max:1,
ticks:{
color:"#94a3b8",
callback:v=>v===1?"SUCCESS":"FAIL"
},
grid:{color:"rgba(148,163,184,.15)"}
}
}
}
})

})
.catch(()=>{
document.getElementById("status").innerText="LOAD ERROR"
document.getElementById("status").style.color="#ef4444"
})

</script>

</body>
</html>
