<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ClineOps Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:linear-gradient(135deg,#0f172a,#020617);
color:#e2e8f0;
font-family:Inter,system-ui;
padding:40px;
}

.container{
display:flex;
gap:30px;
justify-content:center;
flex-wrap:wrap;
}

.card{
background:#020617;
padding:28px;
border-radius:18px;
box-shadow:0 0 40px rgba(0,0,0,.6);
width:420px;
}

.status{
font-size:2rem;
font-weight:bold;
margin-bottom:15px;
text-align:center;
}

.label{opacity:.6;margin-top:14px}
.value{font-weight:bold;margin-top:4px}

.log{
background:#020617;
padding:15px;
border-radius:12px;
height:320px;
overflow:auto;
font-family:monospace;
}

.run{
padding:8px;
border-bottom:1px solid rgba(255,255,255,.05);
}

.ok{color:#22c55e}
.fail{color:#ef4444}

canvas{
margin-top:30px;
max-width:600px;
display:block;
margin-left:auto;
margin-right:auto;
}

</style>
</head>

<body>

<h1 style="text-align:center;">ClineOps Reliability Monitor</h1>

<div class="container">

<!-- MAIN STATUS -->
<div class="card">

<div id="status" class="status">Loading...</div>

<div class="label">Runtime</div>
<div id="runtime" class="value">-</div>

<div class="label">Last Execution</div>
<div id="time" class="value">-</div>

<div class="label">Error</div>
<div id="error" class="value">-</div>

<div class="label">AI Suggestion</div>
<div id="suggestion" class="value">-</div>

<div class="label">Preview Output</div>
<div id="preview" class="value">-</div>

</div>


<!-- HISTORY PANEL -->
<div class="card">

<h3>Run History</h3>
<div id="history" class="log"></div>

</div>

</div>


<canvas id="chart"></canvas>


<script>

fetch("metrics.json?"+Date.now())
.then(r=>r.json())
.then(data=>{

if(!data.runs || data.runs.length===0){
document.getElementById("status").innerText="NO RUNS"
return
}

let runs=data.runs
let latest=runs[runs.length-1]

/* STATUS */

let ok=latest.status==="success"

let status=document.getElementById("status")
status.innerText=latest.status.toUpperCase()
status.style.color= ok ? "#22c55e" : "#ef4444"


/* VALUES */

document.getElementById("runtime").innerText=
latest.runtime ?? latest.runtime_sec ?? "-"

document.getElementById("time").innerText=
latest.time
? new Date(latest.time*1000).toLocaleString()
: latest.timestamp
? new Date(latest.timestamp*1000).toLocaleString()
: "-"

document.getElementById("error").innerText=
latest.error || "None"

document.getElementById("suggestion").innerText=
ok ? "No suggestions" : latest.suggestion || "No suggestion"

document.getElementById("preview").innerText=
latest.preview ?? "-"


/* HISTORY PANEL */

let box=document.getElementById("history")

runs.slice().reverse().forEach((r,i)=>{
let div=document.createElement("div")
div.className="run "+(r.status==="success"?"ok":"fail")

let t=r.time || r.timestamp

div.innerText=
"Run "+(runs.length-i)+" → "
+(r.status==="success"?"SUCCESS":"FAIL")
+" | "+new Date(t*1000).toLocaleTimeString()

box.appendChild(div)
})


/* CURRENT RUN GRAPH */

const ctx=document.getElementById("chart").getContext("2d")

let color= ok ? "#22c55e" : "#ef4444"

new Chart(ctx,{
type:"bar",
data:{
labels:["Current Run"],
datasets:[{
data:[1],
backgroundColor:color
}]
},
options:{
plugins:{legend:{display:false}},
scales:{
y:{display:false},
x:{ticks:{color:"#e2e8f0"}}
}
}
})

})

</script>

</body>
</html>
