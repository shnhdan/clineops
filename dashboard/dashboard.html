<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ClineOps Monitor</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
background:linear-gradient(135deg,#0f172a,#020617);
color:#e2e8f0;
font-family:Inter,system-ui;
text-align:center;
padding:40px;
}

.card{
background:#020617;
padding:32px;
border-radius:18px;
box-shadow:0 0 50px rgba(0,0,0,.6);
margin:auto;
max-width:720px;
margin-bottom:35px;
border:1px solid rgba(34,197,94,.2);
transition:.3s;
}

.card:hover{
transform:translateY(-4px);
box-shadow:0 0 70px rgba(0,0,0,.8);
}

.status{
font-size:2.2rem;
font-weight:bold;
margin-bottom:18px;
letter-spacing:.5px;
}

.label{
opacity:.65;
margin-top:16px;
font-size:.9rem;
}

.value{
font-weight:bold;
margin-top:6px;
font-size:1.05rem;
}

.diff{
background:#020617;
padding:18px;
margin-top:20px;
border-radius:12px;
text-align:left;
font-family:monospace;
border:1px solid rgba(255,255,255,.05);
}

.old{color:#ef4444}
.new{color:#22c55e}

canvas{
margin-top:35px;
max-width:900px;
}
</style>
</head>

<body>

<h1>ClineOps Autonomous Data Guard</h1>

<div class="card">

<div id="status" class="status">Loading...</div>

<div class="label">Runtime</div>
<div id="runtime" class="value">-</div>

<div class="label">Last Execution</div>
<div id="time" class="value">-</div>

<div class="label">Error</div>
<div id="error" class="value">None</div>

<div class="label">AI Suggestion</div>
<div id="suggestion" class="value">-</div>

<div class="label">Preview Output</div>
<div id="preview" class="value">-</div>

<div class="diff">
<div class="old" id="old"></div>
<div class="new" id="new"></div>
</div>

</div>

<canvas id="chart"></canvas>

<script>

fetch("metrics.json?nocache="+Date.now())
.then(r=>r.json())
.then(data=>{

if(!data.runs || data.runs.length===0){
document.getElementById("status").innerText="NO DATA"
return
}

let runs=data.runs
let latest=runs[runs.length-1]

// status
let s=document.getElementById("status")
s.innerText=(latest.status||"unknown").toUpperCase()
s.style.color=latest.status==="success"?"#22c55e":"#ef4444"

// text fields
document.getElementById("runtime").innerText=
latest.runtime_sec? latest.runtime_sec+" sec":"-"

document.getElementById("time").innerText=
latest.timestamp? new Date(latest.timestamp*1000).toLocaleString():"-"

document.getElementById("error").innerText=latest.error||"None"
document.getElementById("suggestion").innerText=latest.suggestion||"-"
document.getElementById("preview").innerText=latest.preview??"-"

document.getElementById("old").innerText=
latest.old_code? "− "+latest.old_code:""

document.getElementById("new").innerText=
latest.new_code? "+ "+latest.new_code:""


// graph
const ctx=document.getElementById("chart").getContext("2d")

const gradient=ctx.createLinearGradient(0,0,0,300)
gradient.addColorStop(0,"#22c55e")
gradient.addColorStop(1,"rgba(34,197,94,0)")

new Chart(ctx,{
type:"line",
data:{
labels:runs.map((_,i)=>"Run "+(i+1)),
datasets:[{
label:"Pipeline Reliability",
data:runs.map(r=>r.status==="success"?1:0),
borderColor:gradient,
backgroundColor:gradient,
fill:true,
tension:.35,
borderWidth:4,
pointRadius:6,
pointHoverRadius:9
}]
},
options:{
responsive:true,
plugins:{
legend:{
labels:{
color:"#e2e8f0",
font:{size:14}
}
}
},
scales:{
x:{
ticks:{color:"#94a3b8"},
grid:{color:"rgba(148,163,184,.15)"}
},
y:{
min:0,
max:1,
ticks:{
color:"#94a3b8",
callback:v=>v===1?"SUCCESS":"FAIL"
},
grid:{color:"rgba(148,163,184,.15)"}
}
}
}
})

})
.catch(()=>{
document.getElementById("status").innerText="LOAD ERROR"
document.getElementById("status").style.color="#ef4444"
})

</script>

</body>
</html>
